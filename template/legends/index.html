// ===================== utils =====================
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const eBack=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const spring=(t,f=9,d=6)=>{if(t<=0)return 0;return 1-Math.exp(-d*t)*Math.cos(f*t)};
const win=(t,a,b)=>clamp((t-a)/(b-a));
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const step12=t=>Math.floor(t*12)/12; // stop-motion pose time
function hexRGB(h){if(h.startsWith('rgb'))return h.match(/\d+/g).slice(0,3).map(Number);h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(h1,h2,t){const a=hexRGB(h1),b=hexRGB(h2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`}

// ===================== path → jittered paper polygon =====================
function parsePath(d){const tk=d.match(/[MCLZ]|-?\d*\.?\d+/g);let i=0,pts=[],cx=0,cy=0,cmd;
  const n=()=>parseFloat(tk[i++]);
  while(i<tk.length){if(/[MCLZ]/.test(tk[i]))cmd=tk[i++];
    if(cmd==='M'){cx=n();cy=n();pts.push([cx,cy]);cmd='L'}
    else if(cmd==='L'){cx=n();cy=n();pts.push([cx,cy])}
    else if(cmd==='C'){const x1=n(),y1=n(),x2=n(),y2=n(),x=n(),y=n();
      for(let s=1;s<=14;s++){const u=s/14,v=1-u;pts.push([v*v*v*cx+3*v*v*u*x1+3*v*u*u*x2+u*u*u*x,v*v*v*cy+3*v*v*u*y1+3*v*u*u*y2+u*u*u*y])}cx=x;cy=y}
    else if(cmd==='Z'){}}
  return pts}
function jitter(pts,seed,amp=1.8,stepLen=10){const r=rng(seed),out=[];
  for(let k=0;k<pts.length;k++){const a=pts[k],b=pts[(k+1)%pts.length];const dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy);
    const n=Math.max(1,Math.round(L/stepLen));const nx=-dy/(L||1),ny=dx/(L||1);
    for(let s=0;s<n;s++){const u=s/n,o=(r()-.5)*2*amp;out.push([a[0]+dx*u+nx*o,a[1]+dy*u+ny*o])}}
  return out}
let SEED=11;
function P(d,amp){return jitter(parsePath(d),SEED++,amp)}
function polyCircle(cx,cy,r,seed,amp=1.6,n=48){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return jitter(p,seed,amp,8)}
function polyRect(x,y,w,h,seed,amp=1.6){return jitter([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],seed,amp,9)}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])}return[a,b,c,d]}
function tracePoly(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath()}
// shadow scale set per layer
let SH=1;
function paper(g,p,color,o={}){
  g.save();tracePoly(g,p);
  if(o.shadow!==false){g.shadowColor=o.shc||'rgba(10,8,30,0.38)';g.shadowBlur=(o.sb||10)*SH;g.shadowOffsetX=(o.sx||4)*SH;g.shadowOffsetY=(o.sy||7)*SH}
  g.fillStyle=color;g.fill();g.restore();
  if(o.light!==false){const bb=p._bb||(p._bb=bbox(p));g.save();tracePoly(g,p);g.clip();
    const gr=g.createLinearGradient(0,bb[1],0,bb[3]);gr.addColorStop(0,'rgba(255,250,235,0.16)');gr.addColorStop(.55,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(20,10,40,0.16)');
    g.fillStyle=gr;g.fillRect(bb[0],bb[1],bb[2]-bb[0],bb[3]-bb[1]);g.restore()}
  g.save();tracePoly(g,p);g.strokeStyle='rgba(255,248,230,0.22)';g.lineWidth=1.6;g.stroke();g.restore()}

function fluff(cx,cy,rx,ry,seed){const r=rng(seed),p=[];const n=11;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;
  for(let s=0;s<=8;s++){const a=lerp(a0,a1,s/8);const bump=Math.sin(s/8*Math.PI)*(12+r()*6);p.push([cx+Math.cos(a)*(rx+bump),cy+Math.sin(a)*(ry+bump)])}}return jitter(p,seed+1,1.2,8)}

function ridge(x0,x1,base,peaks,seed,amp=2){const r=rng(seed);let d=`M ${x0} ${base+600} L ${x0} ${base}`;

const farMts=ridge(-2400,2400,60,[[-2100,-180],[-1800,-60],[-1500,-330],[-1250,-120],[-980,-260],[-700,-90],[-420,-300],[-150,-140],[80,-240],[230,-60],[340,-40],[460,-120],[700,-340],[950,-150],[1250,-290],[1600,-90],[1900,-240],[2200,-80]],301,3);
const farMts2=ridge(-2400,2400,90,[[-2000,-60],[-1600,-150],[-1200,-40],[-800,-170],[-400,-60],[0,-130],[300,-20],[600,-90],[1000,-40],[1400,-160],[1800,-50],[2200,-120]],302,3);
function hillsPoly(seed,base,amp,wl,x0,x1){let p=[[x0,base+900]];for(let x=x0;x<=x1;x+=20)p.push([x,base-amp*(.6+.4*Math.sin(x/wl+seed))*(.7+.3*Math.sin(x/(wl*.37)+seed*2))]);p.push([x1,base+900]);return jitter(p,seed,1.5,12)}

const yurtDome=P(`M -90 0 L -90 -60 C -80 -110 -40 -130 0 -132 C 40 -130 80 -110 90 -60 L 90 0 Z`,1.3);

function tuftPoly(seed,h){const r=rng(seed),p=[[-18,0]];const n=5;for(let i=0;i<n;i++){const x=-14+i*7;p.push([x-3+r()*6,-h*(.6+r()*.5)]);p.push([x+3,-6])}p.push([18,0]);return jitter(p,seed,.8,6)}
const tufts=[];{const r=rng(55);for(let i=0;i<70;i++)tufts.push({x:-2400+r()*4800,s:.7+r()*.9,p:tuftPoly(700+i,40+r()*40),c:r()})}

const stars=[];{const r=rng(99);for(let i=0;i<130;i++)stars.push({x:(r()-.5)*2600,y:-200-r()*2200,s:1+r()*2.6,ph:r()*6})}
const YEARS=['Тышқан','Сиыр','Барыс','Қоян','Ұлу','Жылан','Жылқы','Қой','Мешін','Тауық','Ит','Доңыз'];
const medal=YEARS.map((_,i)=>polyCircle(0,0,76,1200+i,1.6));const medalIn=YEARS.map((_,i)=>polyCircle(0,0,62,1300+i,1.2));
const ashMound=P(`M -460 0 C -380 -70 -220 -95 0 -95 C 220 -95 380 -70 460 0 Z`,2.5);
const puffs=[];{const r=rng(33);for(let i=0;i<14;i++)puffs.push({x:(r()-.5)*700,t0:33.0+i*0.17,r:30+r()*40,vx:(r()-.5)*60,p:polyCircle(0,0,1,1500+i,.02,20)})}
const strips={};const cardPoly=jitter([[0,0],[650,0],[650,250],[0,250]],2001,2.2,10);

// noise grain
const grain=document.createElement('canvas');grain.width=540;grain.height=960;{const g=grain.getContext('2d');const id=g.createImageData(540,960);const r=rng(5);
  for(let i=0;i<id.data.length;i+=4){const v=110+r()*60|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)}

// ===================== camera =====================
const K=[ // t, x, y, zoom, rot
 [0.0,0,-2900,0.9,-0.025],[2.7,0,-2880,0.98,0.02],[3.6,-120,-1500,0.82,0.0],[4.7,-380,-430,0.52,-0.01],[8.1,-330,-380,0.57,0.015],
 [9.4,-445,20,2.55,-0.02],[12.8,-430,10,2.8,0.018],[14.0,-40,-380,1.3,0.0],[15.2,420,-520,1.5,-0.022],[17.7,400,-500,1.42,0.012],
 [18.6,-420,-150,1.9,0.0],[19.6,-300,-220,1.9,-0.015],[20.6,-292,-410,1.85,0.01],[21.7,-230,-580,1.8,-0.01],[22.7,-90,-720,1.74,0.015],
 [23.45,60,-760,1.68,0.0],[24.2,300,-720,1.15,-0.04],[28.0,250,-700,1.1,0.0],[29.9,0,-2565,0.85,0.01],[32.0,0,-2575,0.9,-0.01],
 [33.2,0,-330,0.86,0.0],[37.2,30,-360,0.92,0.012]];
function camAt(t){if(t<=K[0][0])return{x:K[0][1],y:K[0][2],z:K[0][3],r:K[0][4]};const n=K.length;if(t>=K[n-1][0]){const k=K[n-1];return{x:k[1],y:k[2],z:k[3],r:k[4]}}
  let i=0;while(K[i+1][0]<=t)i++;const k0=K[i],k1=K[i+1],h=k1[0]-k0[0],s=(t-k0[0])/h;
  const val=(j,f=v=>v)=>{const p0=f(k0[j]),p1=f(k1[j]);const tan=(a)=>{if(a<=0||a>=n-1)return 0;const d0=(f(K[a][j])-f(K[a-1][j]))/(K[a][0]-K[a-1][0]),d1=(f(K[a+1][j])-f(K[a][j]))/(K[a+1][0]-K[a][0]);if(d0*d1<=0)return 0;const m=(f(K[a+1][j])-f(K[a-1][j]))/(K[a+1][0]-K[a-1][0]);const lim=3*Math.min(Math.abs(d0),Math.abs(d1));return Math.sign(m)*Math.min(Math.abs(m),lim)};
    const m0=tan(i)*h,m1=tan(i+1)*h;const s2=s*s,s3=s2*s;return(2*s3-3*s2+1)*p0+(s3-2*s2+s)*m0+(-2*s3+3*s2)*p1+(s3-s2)*m1};
  return{x:val(1),y:val(2),z:Math.exp(val(3,Math.log)),r:val(4)}}
function setLayer(g,cam,p){const z=1+(cam.z-1)*p;g.setTransform(1,0,0,1,0,0);g.translate(W/2,H/2);g.rotate(cam.r*p);g.scale(z,z);g.translate(-cam.x*p,-cam.y*p);SH=Math.min(2.2,z*(.6+.4*p))}

function nightAmt(t){if(t<3)return .28;if(t<4.6)return lerp(.28,.55,ease(win(t,3,4.6)));if(t<23.7)return .55;return lerp(.55,0,ease(win(t,23.7,25.2)))}
const climbPath=[[-440,0],[-300,0],[-282,-80],[-292,-300],[-270,-470],[-210,-590],[-130,-640],[-60,-585],[-30,-515],[20,-610],[80,-664]];
const climbLen=(()=>{let L=[0];for(let i=1;i<climbPath.length;i++)L.push(L[i-1]+Math.hypot(climbPath[i][0]-climbPath[i-1][0],climbPath[i][1]-climbPath[i-1][1]));return L})();
function mouseState(t){ // returns x,y,angle,run
  if(t<18.6)return{x:-440,y:0,a:0,run:false};
  const tot=climbLen[climbLen.length-1];const u=clamp((t-18.6)/(23.3-18.6));const d=ease(u)*0.15+u*0.85;const L=d*tot;
  let i=1;while(i<climbLen.length-1&&climbLen[i]<L)i++;const a=climbPath[i-1],b=climbPath[i];const s=(L-climbLen[i-1])/(climbLen[i]-climbLen[i-1]);
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);return{x:lerp(a[0],b[0],s),y:lerp(a[1],b[1],s),a:ang,run:u<1}}

function drawLeg(g,p,x,y,len,rot,color){g.save();g.translate(x,y);g.rotate(rot);g.scale(1,len/300);paper(g,p,color,{sy:4,sx:3,light:false});g.restore()}
function drawCamel(g,t){const ts=step12(t);let kneel=eOut(win(t,32.5,33.3));let sway=0;
  if(t>33.2)sway=Math.sin((ts-33.2)*4.2)*0.07*clamp((t-33.2)*2);
  const talk=(t>13.4&&t<17.8)?Math.abs(Math.sin(ts*9))*0.02:0;
  const breathe=Math.sin(ts*2.2)*3;
  g.save();
  const legLen=300*(1-.72*kneel);const bodyDrop=230*kneel;
  g.translate(0,bodyDrop);g.rotate(sway);
  // far legs
  drawLeg(g,legs[0],-210,-305,legLen,0.02*Math.sin(ts*1.3),C.camelF);
  drawLeg(g,legs[1],200,-305,legLen,-0.02*Math.sin(ts*1.3),C.camelF);
  paper(g,camelTail,C.camelF);
  g.save();g.translate(0,breathe*0.3);g.translate(420,-520);g.rotate(-talk*3);g.translate(-420,520);
  paper(g,camelBody,C.camel,{sb:16,sy:10});paper(g,camelFur1,C.camelD,{shadow:false});paper(g,camelFur2,C.camelD,{shadow:false});paper(g,camelBeard,C.camelD,{shadow:false});paper(g,camelEar,C.camelD,{shadow:false});
  // eye (blink)
  const blink=((ts%3.1)<0.17)||(t>28.8&&t<32.4)?0.25:1;
  g.fillStyle='#2A1E18';g.beginPath();g.ellipse(472,-560,6.5,6.5*blink,0,0,7);g.fill();
  g.strokeStyle='#5a3d22';g.lineWidth=3;g.beginPath();g.moveTo(462,-572);g.lineTo(484,-576);g.stroke(); // proud brow
  g.restore();
  // near legs
  drawLeg(g,legs[2],-265,-305,legLen,-0.02*Math.sin(ts*1.3+1),C.camelD);
  drawLeg(g,legs[3],150,-305,legLen,0.02*Math.sin(ts*1.3+1),C.camelD);
  g.restore()}

  g.beginPath();g.moveTo(-14,-4);g.lineTo(-14+lp,2);g.moveTo(18,-4);g.lineTo(18-lp,2);g.stroke();
  paper(g,mouseBody,C.mouse,{sb:6,sy:4,sx:2});paper(g,mouseEar,C.mouseD,{shadow:false});paper(g,mouseEarIn,C.pink,{shadow:false,light:false});

function drawCow(g,t){const ts=step12(t);g.save();g.translate(-1180,0);const b=Math.sin(ts*1.4+1)*2;

  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);

  const blurFar=Math.max(0,(cam.z-1.2))*1.6;

  paper(g,farMts,mix('#3b3f7a','#7a86b8',sun),{sb:14});
  g.filter='none';
  setLayer(g,cam,0.55);paper(g,farMts2,mix('#4a4a7e','#8f9a7a',sun),{sb:12});
  setLayer(g,cam,0.75);paper(g,midHills,mix('#6c6a4a','#a7a35a',sun),{sb:14});

  drawCow(g,t);drawSheep(g,t);drawHorse(g,t);drawCamel(g,t);

  if(t<4.3||(t>28.9&&t<33.4))drawRing(g,t);

  setLayer(g,cam,1.35);g.filter='blur(7px)';g.globalAlpha=clamp(1.5-cam.z)*(t>32.4?0.3:1);if(g.globalAlpha>0)for(const f of fgGrass){g.save();g.translate(f.x,90);g.scale(f.s,f.s);paper(g,f.p,'#3e4724',{shadow:false,light:false});g.restore()}g.filter='none';g.globalAlpha=1;

    const sx=W/2+dx*cs-dy*sn,sy=H/2+dx*sn+dy*cs;const a=clamp((t-8.2)*2)*clamp((24.6-t)*1.5)*0.55;const rad=150*cam.z;

    const rg=g.createRadialGradient(W*0.82,H*0.42,10,W*0.82,H*0.42,1300);rg.addColorStop(0,`rgba(255,200,110,${0.55*fl+0.18*sun})`);rg.addColorStop(1,'rgba(255,170,80,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over'}

function drawCard(g,c,t){if(t<c.a||t>c.b+0.4)return;const inn=spring(t-c.a,10,5.5);const out=eOut(win(t,c.b,c.b+0.35));

  const cp=eOut(win(t,36.3,36.6));g.globalAlpha=cp;paper(g,jitter([[60,840],[770,840],[770,940],[60,940]],5005,2,9),C.felt,{sb:10});

function finish(g,t){g.setTransform(1,0,0,1,0,0);// grain + vignette
  g.globalCompositeOperation='overlay';g.globalAlpha=0.16;const ox=(step12(t)*977%200)|0,oy=(step12(t)*631%200)|0;g.drawImage(grain,-ox,-oy,W+400,H+400);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  const vg=g.createRadialGradient(W/2,H*0.47,H*0.32,W/2,H/2,H*0.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,6,30,0.42)');g.fillStyle=vg;g.fillRect(0,0,W,H)}

// ===================== render =====================
function camSpeed(t){const a=camAt(t),b=camAt(t+1/FPS);const dz=Math.abs(Math.log(b.z/a.z))*900;return Math.hypot((b.x-a.x)*a.z,(b.y-a.y)*a.z)+dz}
window.renderAt=function(t){const sp=camSpeed(t);const n=sp>45?6:sp>18?4:1;
  if(n===1){drawWorld(ctx,t)}else{const sh=0.55/FPS;ctx.setTransform(1,0,0,1,0,0);
    for(let i=0;i<n;i++){const ts=t-sh/2+sh*i/(n-1);drawWorld(bctx,ts);ctx.globalAlpha=1/(i+1);ctx.drawImage(buf,0,0);}ctx.globalAlpha=1}
  finish(ctx,t);drawUI(ctx,t);return n};
window.ready=document.fonts.load('700 40px Lora').then(()=>document.fonts.load('italic 600 40px Lora')).then(()=>document.fonts.load('800 40px Mont')).then(()=>document.fonts.load('900 40px Mont')).then(()=>document.fonts.ready).then(()=>{renderAt(0);return document.fonts.check('800 40px Mont')&&document.fonts.check('700 40px Lora')});
